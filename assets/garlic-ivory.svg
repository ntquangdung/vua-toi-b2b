  <g stroke="#C5A052" stroke-width=".9" stroke-linecap="round" opacity=".25">
    <path d="M312 280C292 344 284 421 291 489M307 531L316 560M323 311C312 371 310 429 315 465"/>
    <path d="M234 328C214 390 213 449 228 491M396 306C422 365 430 428 420 489"/>
    <path d="M468 326C494 373 500 422 488 462M184 355C166 409 174 455 191 490"/>
  </g>
  <g stroke="#AA8848" stroke-width="1.4" stroke-linecap="round" opacity=".82">
    <path d="M299 579L287 593M311 581L305 601M324 584L324 603M337 584L344 601M350 582L362 594"/>
  </g>
  <path d="M104 444C88 435 82 421 86 404C102 411 109 425 104 444Z" fill="#B00D13" opacity=".84"/>
</svg>
