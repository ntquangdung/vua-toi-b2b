<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none">
  <title>Củ tỏi trắng — minh họa thực vật Vua Tỏi</title>
  <desc>Minh họa nguyên bản một củ tỏi trắng phân múi, cổ giấy khô và nhánh lá viền vàng. Nền trong suốt.</desc>
  <defs>
    <linearGradient id="bulb" x1="180" y1="245" x2="465" y2="563" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF7"/><stop offset=".48" stop-color="#FFF6E9"/><stop offset="1" stop-color="#EAD8B7"/>
    </linearGradient>
    <linearGradient id="neck" x1="309" y1="115" x2="383" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6E9"/><stop offset=".5" stop-color="#EEDDBD"/><stop offset="1" stop-color="#FCF2DF"/>
    </linearGradient>
    <linearGradient id="left" x1="157" y1="320" x2="263" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E9D5"/><stop offset=".48" stop-color="#FFF9EF"/><stop offset="1" stop-color="#E4CCA3"/>
    </linearGradient>
    <linearGradient id="middle" x1="296" y1="265" x2="359" y2="568" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF7"/><stop offset=".65" stop-color="#FFF6E9"/><stop offset="1" stop-color="#E8D2AB"/>
    </linearGradient>
    <linearGradient id="right" x1="415" y1="280" x2="466" y2="546" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9F0"/><stop offset=".54" stop-color="#F7EAD5"/><stop offset="1" stop-color="#DDC497"/>
    </linearGradient>
    <linearGradient id="gold" x1="150" y1="220" x2="505" y2="562" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7BC7F"/><stop offset=".5" stop-color="#C5A052"/><stop offset="1" stop-color="#A98542"/>
    </linearGradient>
    <radialGradient id="shadow"><stop stop-color="#6D4F23" stop-opacity=".16"/><stop offset="1" stop-color="#6D4F23" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- Fine botanical strokes are decorative, separate from the bulb. -->
  <g stroke="#C5A052" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".73">
    <path d="M462 247C493 213 516 168 533 115"/>
    <path d="M490 208C486 187 489 168 502 152C507 177 503 193 490 208Z" fill="#FFF6E9"/>
    <path d="M509 173C510 148 522 135 546 127C539 149 529 164 509 173Z" fill="#FFF6E9"/>
    <path d="M525 134C521 115 526 95 539 80C545 101 540 120 525 134Z" fill="#FFF6E9"/>
    <path d="M469 239C470 218 480 205 497 198C493 217 483 232 469 239Z" fill="#FFF6E9"/>
  </g>
  <ellipse cx="325" cy="584" rx="222" ry="31" fill="url(#shadow)"/>
  <!-- The dry neck bends gently instead of forming a geometric stem. -->
  <path d="M287 249C307 220 314 192 312 159C309 122 319 86 338 49C341 43 348 46 347 52C341 86 343 111 353 143C361 172 358 198 376 224L402 254L287 249Z" fill="url(#neck)" stroke="url(#gold)" stroke-width="2"/>
  <g stroke="#B99A60" stroke-linecap="round" opacity=".5">
    <path d="M337 62C325 101 325 132 331 164C338 198 330 222 324 242" stroke-width="1.5"/>
    <path d="M344 111C342 151 353 189 348 230" stroke-width="1.1"/>
    <path d="M317 173C319 197 310 226 301 243M359 205L377 244"/>
  </g>
  <!-- Each lobe follows the natural tapered form of a garlic clove. -->
  <path d="M322 225C280 224 241 233 203 255C154 283 124 326 120 382C115 451 145 511 197 548C232 574 275 586 319 578C364 590 417 578 456 556C514 523 548 468 549 407C551 342 521 294 470 265C432 243 393 234 354 232C343 230 334 227 322 225Z" fill="url(#bulb)" stroke="url(#gold)" stroke-width="2.2"/>
  <path d="M274 234C219 251 179 299 163 358C141 434 159 500 207 551C169 534 141 495 129 449C115 396 120 349 151 308C179 272 220 247 274 234Z" fill="url(#left)" stroke="url(#gold)" stroke-width="1.3"/>
  <path d="M300 229C260 261 230 305 217 363C199 443 215 519 253 572C228 567 203 550 184 527C157 493 155 431 170 374C190 302 235 248 300 229Z" fill="url(#bulb)" stroke="url(#gold)" stroke-width="1.4"/>
  <path d="M318 228C297 274 278 328 270 391C262 464 270 529 297 581C277 584 254 574 236 554C211 518 204 451 219 387C232 322 267 259 318 228Z" fill="url(#middle)" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M335 230C361 270 379 325 388 390C401 470 387 536 354 582C335 587 314 585 296 576C271 533 268 464 277 400C286 329 308 268 335 230Z" fill="url(#middle)" stroke="url(#gold)" stroke-width="1.7"/>
  <path d="M345 231C395 252 433 294 451 354C473 431 455 507 413 571C393 580 373 583 354 582C383 540 395 467 385 395C377 326 361 271 345 231Z" fill="url(#right)" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M369 235C437 247 484 284 510 340C541 405 527 480 482 530C462 552 439 564 413 571C454 513 472 438 451 364C434 304 404 263 369 235Z" fill="url(#bulb)" stroke="url(#gold)" stroke-width="1.4"/>
  <path d="M422 249C475 265 516 298 535 347C556 400 550 457 523 500C512 517 497 531 482 540C525 478 532 417 511 359C493 309 460 271 422 249Z" fill="url(#right)" stroke="url(#gold)" stroke-width="1.2"/>
